name: Team launcher checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/verify_repository.py
